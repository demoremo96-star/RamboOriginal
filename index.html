
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<meta name="description" content="RAMBO REPORTER - Cricket News, Match Analysis & Expert Predictions">
<title>RAMBO REPORTER | Official Channel</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    font-family: Arial, sans-serif;
    color: white;
    overflow: hidden;
    background: radial-gradient(circle at center, #38250e, #111 55%, #050505);
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: radial-gradient(#f7c85b 1px, transparent 1px);
    background-size: 38px 38px;
    opacity: 0.18;
    pointer-events: none;
}

.glow {
    position: fixed;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: #d88a1b;
    filter: blur(130px);
    opacity: 0.15;
    top: 15%;
    left: 50%;
    transform: translateX(-50%);
}

.container {
    width: 92%;
    max-width: 650px;
    position: relative;
    padding: 30px 15px;
}

/* LOGO */

.logo {
    width: 125px;
    height: 125px;
    margin: 0 auto 25px;
    border: 2px solid #f7c85b;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(145deg, #302315, #080808);
    box-shadow: 0 0 25px #f7c85b66,
                0 0 50px #f7c85b22;
    overflow: hidden;
}

.logo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 5px;
    border-radius: 50%;
}

.welcome {
    color: #ffe7a0;
    font-size: 11px;
    letter-spacing: 4px;
    font-weight: bold;
}

h1 {
    font-size: clamp(38px, 9vw, 65px);
    margin: 18px 0;
    line-height: 1.05;
    color: #f7c85b;
    letter-spacing: 2px;
    text-shadow: 0 0 15px #f7c85b88,
                 0 0 30px #f7c85b44;
}

.line {
    width: 120px;
    height: 2px;
    margin: 20px auto;
    background: linear-gradient(90deg, transparent, #f7c85b, transparent);
}

.tagline {
    color: #f5dfb2;
    font-size: 15px;
    letter-spacing: 1px;
    line-height: 1.7;
    margin-bottom: 25px;
}

.features {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 30px;
}

.features span {
    border: 1px solid #c99b4b77;
    padding: 10px 13px;
    border-radius: 30px;
    font-size: 11px;
    color: #ffe7a0;
    background: #ffffff08;
}

.join-btn {
    display: inline-block;
    padding: 16px 28px;
    border-radius: 50px;
    text-decoration: none;
    color: #171006;
    font-weight: 900;
    letter-spacing: 1px;
    background: linear-gradient(110deg, #ffe8a1, #e8ad36, #ffe8a1);
    box-shadow: 0 0 25px #f7c85b66;
    transition: 0.3s;
}

.join-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 40px #f7c85b;
}

.redirect {
    margin-top: 25px;
    color: #c4bba9;
    font-size: 13px;
}

#count {
    color: #ffe7a0;
    font-weight: bold;
    font-size: 17px;
}

.progress-bar {
    width: 250px;
    max-width: 80%;
    height: 3px;
    margin: 15px auto;
    background: #ffffff22;
    border-radius: 10px;
    overflow: hidden;
}

.progress {
    width: 0%;
    height: 100%;
    background: #f7c85b;
    animation: loading 10s linear forwards;
}

@keyframes loading {
    to { width: 100%; }
}

footer {
    margin-top: 35px;
    font-size: 11px;
    letter-spacing: 1.5px;
    line-height: 1.8;
    color: #a99b80;
}

@media (max-width: 400px) {
    .logo {
        width: 105px;
        height: 105px;
    }

    .features span {
        font-size: 10px;
        padding: 8px 10px;
    }
}
</style>
</head>

<body>

<div class="glow"></div>

<div class="container">

    <!-- YOUR ORIGINAL LOGO -->
    <div class="logo">
        <img src="logo.png" alt="Rambo Reporter Logo">
    </div>

    <div class="welcome">
        WELCOME TO THE WORLD OF CRICKET
    </div>

    <h1>RAMBO<br>REPORTER</h1>

    <div class="line"></div>

    <p class="tagline">
        HAR MATCH KI SAHI KHABAR,<br>
        RAMBO REPORTER KE SAATH!
    </p>

    <div class="features">
        <span>🏏 CRICKET NEWS</span>
        <span>📊 MATCH ANALYSIS</span>
        <span>🎯 EXPERT PREDICTIONS</span>
    </div>

    <a class="join-btn"
       href="https://t.me/hahsbdhdhjdnbbsnsnj">
       ✈ JOIN TELEGRAM CHANNEL
    </a>

    <p class="redirect">
        Redirecting in
        <span id="count">10</span>
        seconds...
    </p>

    <div class="progress-bar">
        <div class="progress"></div>
    </div>

    <footer>
        STRATEGY MEETS VICTORY<br>
        SEE THE GAME DIFFERENTLY
    </footer>

</div>

<script>
const telegramLink = "https://t.me/hahsbdhdhjdnbbsnsnj";

let seconds = 10;

const counter = document.getElementById("count");

const timer = setInterval(function() {

    seconds--;
    counter.textContent = seconds;

    if (seconds <= 0) {
        clearInterval(timer);
        window.location.replace(telegramLink);
    }

}, 1000);
</script>

</body>
</html>
